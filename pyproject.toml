[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgraph-profiler"
version = "0.1.0"
description = "Critical-path and contention analysis for timestamped AI-agent tool-call traces."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yashkhou"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
